services:
  # FastAPI. The persistent disk is required because the application currently uses SQLite.
  - type: web
    name: landmine-guy-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: landmine-guy-rooms
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ROOMS_DB_PATH
        value: /var/data/rooms.db
      - key: SONY_API_KEY
        sync: false
      - key: SONY_API_URL
        value: https://user-api.predictionone.sony.biz/v1/groups/qejw062trt0qwwav/classifiers/quipaioomqira6hd/inference
      # Set this to the final Render static-site URL after the first frontend deploy.
      - key: CORS_ORIGINS
        sync: false

  # Svelte/Vite static frontend.
  - type: web
    name: landmine-guy-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Set this to https://landmine-guy-api.onrender.com after the API deploys.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
