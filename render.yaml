services:
  # FastAPI backend. SQLite is temporary on the free plan.
  - type: web
    name: landmine-guy-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render requires a fully qualified version for PYTHON_VERSION.
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ROOMS_DB_PATH
        value: /tmp/rooms.db
      - key: SONY_API_KEY
        sync: false
      - key: SONY_API_URL
        value: https://user-api.predictionone.sony.biz/v1/groups/qejw062trt0qwwav/classifiers/quipaioomqira6hd/inference
      # Set this to the actual Cloudflare Pages origin after checking it.
      - key: CORS_ORIGINS
        sync: false

